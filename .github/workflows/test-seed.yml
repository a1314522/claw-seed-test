name: Seed Germination Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install Ollama
      run: |
        echo "=== Installing Ollama ==="
        curl -fsSL https://ollama.com/install.sh | sh
        ollama --version
    
    - name: Pull llama3.2:1b Model
      run: |
        echo "=== Pulling llama3.2:1b (~1.2GB) ==="
        ollama pull llama3.2:1b
        ollama list
    
    - name: Setup Seed Environment
      run: |
        echo "=== Setting up seed ==="
        ls -la
        # The seed is in openclaw-seed-*/ directory
        SEED_DIR=$(ls -d openclaw-seed-* | head -1)
        echo "Seed directory: $SEED_DIR"
        cp -r "$SEED_DIR"/* .
        ls -la
    
    - name: Install Python Dependencies
      run: |
        pip install ollama -q
    
    - name: Test Seed Identity
      run: |
        echo "=== Test 1: Identity Check ==="
        SEED_DIR=$(ls -d openclaw-seed-* | head -1)
        python3 -c "
import sys
sys.path.insert(0, '.')
# Read SOUL.md and MEMORY.md
soul = open('$SEED_DIR/workspace/SOUL.md').read() if __import__('os').path.exists('$SEED_DIR/workspace/SOUL.md') else 'NOT FOUND'
memory = open('$SEED_DIR/workspace/MEMORY.md').read() if __import__('os').path.exists('$SEED_DIR/workspace/MEMORY.md') else 'NOT FOUND'
print(f'SOUL.md: {len(soul)} bytes')
print(f'MEMORY.md: {len(memory)} bytes')
print(f'SOUL.md first 200 chars: {soul[:200]}')
"
    
    - name: Test Minimal CLAW Script
      run: |
        echo "=== Test 2: Minimal CLAW Script ==="
        SEED_DIR=$(ls -d openclaw-seed-* | head -1)
        SCRIPT="$SEED_DIR/restore-scripts/minimal_claw.py"
        if [ -f "$SCRIPT" ]; then
          echo "Script found: $SCRIPT"
          wc -l "$SCRIPT"
          head -30 "$SCRIPT"
        else
          echo "Script NOT found at $SCRIPT"
          find . -name "minimal_claw.py"
        fi
    
    - name: Run Minimal CLAW - Interactive Test
      run: |
        echo "=== Test 3: Running Minimal CLAW ==="
        SEED_DIR=$(ls -d openclaw-seed-* | head -1)
        
        # Create a test input file
        cat > /tmp/test-input.txt << 'EOF'
whoami
mode
status
help
exit
EOF
        
        # Run with input redirected
        cd "$SEED_DIR/restore-scripts"
        # Modify the script to use the workspace in the seed
        sed -i "s|/root/.openclaw/workspace|/github/workspace/$SEED_DIR/workspace|g" minimal_claw.py 2>/dev/null || true
        sed -i "s|/root/.openclaw/.create-seed.sh|/github/workspace/$SEED_DIR/restore-scripts/setup-ollama.sh|g" minimal_claw.py 2>/dev/null || true
        
        # Run the test
        cat /tmp/test-input.txt | timeout 60 python3 minimal_claw.py 2>&1 || echo "Test completed or timed out"
      timeout-minutes: 5
    
    - name: Archive Results
      if: always()
      run: |
        echo "=== Test Complete ==="
        echo "Disk usage:"
        df -h
        echo "Memory usage:"
        free -h
