name: CLAW Growth Cycle
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Read Last State
      run: |
        LAST=$(ls -t diary/*.md 2>/dev/null | head -1)
        echo "last=$LAST" >> $GITHUB_ENV
        echo "Previous: $LAST"
    
    - name: Install Ollama + Run
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        sleep 5
        ollama pull llama3.2:1b
        pip install ollama -q
        echo "continue" | python3 openclaw-seed-20260605-160258/restore-scripts/minimal_claw.py > diary/$(date +%Y%m%d-%H%M).md || echo "Run completed"
    
    - name: Process Results
      run: |
        python3 -c "
        import os, json, glob
        results = glob.glob('results/**/*.json', recursive=True)
        print(f'Found {len(results)} result files')
        for r in results:
            print(f'  - {r}')
        "
    
    - name: Write Back
      env:
        GH_TOKEN: ${{ secrets.CLAW_TOKEN }}
      run: |
        git config user.name "CLAW"
        git config user.email "claw@openclaw.local"
        git add diary/ results/ nodes/
        git commit -m "growth: $(date) [skip ci]" || echo "Nothing to commit"
        git push https://a1314522:${GH_TOKEN}@github.com/a1314522/claw-seed-test.git HEAD:main || echo "Push failed"
