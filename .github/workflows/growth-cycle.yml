name: CLAW Growth Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  issues: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Read Last State
      run: |
        LAST=$(ls -t diary/*.md 2>/dev/null | head -1)
        echo "last=$LAST" >> $GITHUB_ENV
        echo "Previous: $LAST"
    
    - name: Process Tasks
      env:
        GH_TOKEN: ${{ secrets.CLAW_TOKEN }}
      run: |
        mkdir -p diary results nodes
        python3 -c "
        import requests, json, os
        from datetime import datetime
        
        REPO = 'a1314522/claw-seed-test'
        TOKEN = os.environ['GH_TOKEN']
        NODE_ID = 'actions-1'
        headers = {'Authorization': f'token {TOKEN}', 'Accept': 'application/vnd.github.v3+json'}
        
        r = requests.get(f'https://api.github.com/repos/{REPO}/issues?state=open', headers=headers)
        all_issues = r.json() if r.status_code == 200 else []
        if not isinstance(all_issues, list): all_issues = []
        
        task_labels = {'task:search', 'task:sync', 'task:ping'}
        issues = []
        for issue in all_issues:
            labels = {l['name'] for l in issue.get('labels', [])}
            if labels & task_labels:
                issues.append(issue)
        
        print(f'Found {len(issues)} open tasks')
        
        for issue in issues:
            issue_num = issue['number']
            print(f'Processing issue #{issue_num}: {issue[\"title\"]}')
            try:
                task = json.loads(issue['body'])
            except:
                task = {'type': 'search', 'params': {'query': issue['title']}, 'task_id': f't-{issue_num}'}
            
            task_type = task.get('type', '')
            params = task.get('params', {})
            
            if task_type == 'search':
                result = {'query': params.get('query', ''), 'results': [f'Action node processed: {params.get(\"query\", \"\")}'], 'timestamp': datetime.now().isoformat(), 'node': NODE_ID}
            elif task_type == 'sync':
                result = {'status': 'sync placeholder', 'node': NODE_ID}
            elif task_type == 'ping':
                result = {'status': 'alive', 'timestamp': datetime.now().isoformat(), 'node': NODE_ID}
            else:
                result = {'error': f'unknown type: {task_type}', 'node': NODE_ID}
            
            result_json = json.dumps(result, indent=2, ensure_ascii=False)
            requests.post(f'https://api.github.com/repos/{REPO}/issues/{issue_num}/comments', headers=headers, json={'body': f'Result from {NODE_ID}: {result_json}'})
            requests.patch(f'https://api.github.com/repos/{REPO}/issues/{issue_num}', headers=headers, json={'state': 'closed', 'labels': ['status:done']})
            
            task_id = task.get('task_id', f't-{issue_num}')
            date_str = datetime.now().strftime('%Y-%m-%d')
            os.makedirs(f'results/{date_str}', exist_ok=True)
            with open(f'results/{date_str}/{task_id}-{NODE_ID}.json', 'w') as f:
                f.write(result_json)
            print(f'  Task {task_id} completed')
        
        now = datetime.now()
        diary_entry = f'# CLAW Growth Cycle - {now.strftime(\"%Y-%m-%d %H:%M\")}\n\n**Node:** {NODE_ID}\n**Status:** Active\n**Tasks processed:** {len(issues)}\n**Last state:** {os.environ.get(\"last\", \"None\")}\n\n---\n\n*Automated entry. Lightweight cycle (no Ollama).*\n'
        with open(f'diary/{now.strftime(\"%Y%m%d-%H%M\")}.md', 'w') as f:
            f.write(diary_entry)
        print(f'Diary written: diary/{now.strftime(\"%Y%m%d-%H%M\")}.md')
        "
    
    - name: Write Back
      env:
        GH_TOKEN: ${{ secrets.CLAW_TOKEN }}
      run: |
        git config user.name "CLAW"
        git config user.email "claw@openclaw.local"
        mkdir -p diary results nodes
        git add diary/ results/ nodes/ || echo "Some dirs missing"
        git commit -m "growth: $(date) [skip ci]" || echo "Nothing to commit"
        git push https://a1314522:${GH_TOKEN}@github.com/a1314522/claw-seed-test.git HEAD:main || echo "Push failed"
